      setLog([{ id: Date.now(), stat: q.stat, label: q.label, detail: detail, minutes: mins, ts: Date.now() }].concat(log).slice(0, 80));

      if (lastActiveDate !== today) { setStreak(streak + 1); setLastActiveDate(today); }

      setOpenQuest(null); setDetailText(""); setMinutes(25);
    }

    function toggleHomeTask(id) {
      var day = Object.assign({}, homeTasks[today] || {});
      day[id] = day[id] ? undefined : Date.now();
      var next = Object.assign({}, homeTasks); next[today] = day;
      setHomeTasks(next);
    }
    function toggleWeeklyTask(id) {
      var wk = Object.assign({}, weeklyTasks[today] || {});
      wk[id] = wk[id] ? undefined : Date.now();
      var next = Object.assign({}, weeklyTasks); next[today] = wk;
      setWeeklyTasks(next);
    }
    function adjustConfidence(name, delta) {
      var cur = (subjects[name] && subjects[name].confidence) || 0;
      var next = Object.assign({}, subjects);
      next[name] = { confidence: Math.max(0, Math.min(100, cur + delta)) };
      setSubjects(next);
    }
    function subjectMinutes(name) {
      return log.filter(function (l) { return l.stat === "intellect" && l.detail === name; })
                .reduce(function (s, l) { return s + l.minutes; }, 0);
    }
    function hwPending(name) {
      return homework.filter(function (h) { return h.subject === name && !h.done; }).length;
    }
    function addEvent() {
      if (!evTitle.trim() || !evDate) return;
      setEvents(events.concat([{ id: Date.now(), title: evTitle.trim(), date: evDate }]));
      setEvTitle(""); setEvDate(""); setAddingEvent(false);
    }
    function addHomework() {
      if (!hwTitle.trim() || !hwDue) return;
      setHomework(homework.concat([{ id: Date.now(), title: hwTitle.trim(), subject: hwSubject, due: hwDue, done: false }]));
      setHwTitle(""); setHwDue(""); setAddingHw(false);
    }
    function toggleHomework(id) {
      setHomework(homework.map(function (h) { return h.id === id ? Object.assign({}, h, { done: !h.done }) : h; }));
    }

    var day = WEEK[activeDay];
    var isToday = activeDay === todayKey();

    var todayLog = (function () {
      if (!isToday) return [];
      var items = [];
      log.filter(function (l) { return sameDate(l.ts, today); }).forEach(function (l) {
        items.push({ ts: l.ts, text: l.detail + " — +" + l.minutes + "m " + STAT_META[l.stat].label, color: STAT_META[l.stat].color });
      });
      var dt = homeTasks[today] || {};
      HOME_TASKS.forEach(function (t) { if (dt[t.id]) items.push({ ts: dt[t.id], text: t.label, color: "#5FBF7A" }); });
      if (isSundayNow) {
        var wk = weeklyTasks[today] || {};
        WEEKLY_TASKS.forEach(function (t) { if (wk[t.id]) items.push({ ts: wk[t.id], text: t.label + " (weekly)", color: "#5FBF7A" }); });
      }
      items.sort(function (a, b) { return a.ts - b.ts; });
      return items;
    })();

    var sortedSubjects = SUBJECTS.slice().sort(function (a, b) {
      return ((subjects[a] && subjects[a].confidence) || 0) - ((subjects[b] && subjects[b].confidence) || 0);
    });
    var sortedEvents = events.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    var sortedHw = homework.slice().sort(function (a, b) {
      return a.done === b.done ? a.due.localeCompare(b.due) : (a.done ? 1 : -1);
    });

    var kids = [];

    /* flash */
    if (flash) {
      kids.push(e("div", { key: "flash", className: "asc-flash", style: S.flashWrap },
        e("div", { style: Object.assign({}, S.flashCard, { borderColor: STAT_META[flash.stat].color }) },
          e("span", { className: "asc-mono", style: { fontSize: 11, color: "#9A9A9A" } }, "LEVEL UP"),
          e("span", { className: "asc-display", style: { fontSize: 22, color: STAT_META[flash.stat].color } },
            STAT_META[flash.stat].label + " → Lv." + flash.level)
        )
      ));
    }

    /* header */
    kids.push(e("div", { key: "hdr", style: S.header },
      e("div", null,
        e("div", { className: "asc-display", style: S.title }, "ASCENT"),
        e("div", { className: "asc-mono", style: S.subtitle }, rank.title + " · Rank " + totalLevel)
      ),
      e("div", { style: S.streakWrap },
        e(IFlame, { size: 14, color: "#E8894B" }),
        e("span", { className: "asc-mono", style: { fontSize: 12 } }, streak.toFixed(1))
      )
    ));

    /* stat rail */
    kids.push(e("div", { key: "rail", className: "asc-scroll", style: S.statRail },
      STAT_KEYS.map(function (key) {
        var meta = STAT_META[key], info = levelInfo(stats[key].xp);
        var pct = Math.round((info.into / info.span) * 100);
        return e("div", { key: key, style: S.statCard },
          e("div", { style: S.statTop },
            e(meta.icon, { size: 14, color: meta.color }),
            e("span", { className: "asc-mono", style: { fontSize: 11, color: "#C9C9C9" } }, "Lv." + info.level)
          ),
          e("div", { className: "asc-mono", style: { fontSize: 12, marginTop: 4 } }, meta.label),
          e("div", { style: S.barTrack },
            e("div", { className: "asc-bar-fill", style: Object.assign({}, S.barFill, { width: pct + "%", background: meta.color }) })
          ),
          e("div", { className: "asc-mono", style: { fontSize: 9, color: "#6B6B6B", marginTop: 3 } }, meta.tag)
        );
      })
    ));

    /* day selector */
    kids.push(e("div", { key: "days", style: S.dayRow },
      DAYS.map(function (d) {
        return e("button", {
          key: d.key, className: "asc-mono",
          onClick: function () { setActiveDay(d.key); },
          style: Object.assign({}, S.dayBtn, {
            borderColor: activeDay === d.key ? "#B3272C" : "#2A2A2A",
            color: activeDay === d.key ? "#EDEBE6" : "#7A7A7A",
            background: d.key === todayKey() ? "#171010" : "transparent"
          })
        }, d.label);
      })
    ));

    /* timeline */
    var tl = [];
    tl.push(e("div", { key: "t", className: "asc-display", style: Object.assign({}, S.sectionTitle, { marginBottom: 10 }) },
      DAYS.find(function (d) { return d.key === activeDay; }).full + (isToday ? " · TODAY" : "")));

    if (day.free) {
      tl.push(e("div", { key: "free", className: "asc-mono", style: S.freeNote },
        "Open day — nothing fixed. Wake up whenever, go straight to the quest board."));
    } else {
      if (day.wake) tl.push(e("div", { key: "wake", style: S.timelineRow },
        e(IClock, { size: 13, color: "#6B6B6B" }),
        e("span", { className: "asc-mono", style: S.timelineTime }, day.wake),
        e("span", { className: "asc-mono", style: S.timelineLabel }, "Wake up")));
      if (day.leave) tl.push(e("div", { key: "leave", style: S.timelineRow },
        e(IClock, { size: 13, color: "#6B6B6B" }),
        e("span", { className: "asc-mono", style: S.timelineTime }, day.leave),
        e("span", { className: "asc-mono", style: S.timelineLabel }, "Leave for uni")));
      if (day.online) tl.push(e("div", { key: "onl", style: S.timelineRow },
        e(IClock, { size: 13, color: "#6B6B6B" }),
        e("span", { className: "asc-mono", style: S.timelineTime }, "—"),
        e("span", { className: "asc-mono", style: S.timelineLabel }, "Online — at home")));

      day.blocks.forEach(function (b, i) {
        tl.push(e("div", { key: "b" + i, style: S.timelineRow },
          e(IClock, { size: 13, color: "#B3272C" }),
          e("span", { className: "asc-mono", style: S.timelineTime }, b.time),
          e("div", { style: { display: "flex", flexDirection: "column" } },
            e("span", { className: "asc-mono", style: S.timelineLabel }, b.course),
            e("span", { className: "asc-mono", style: { fontSize: 10, color: "#6B6B6B", display: "flex", alignItems: "center", gap: 3, marginTop: 2 } },
              e(IPin, { size: 9, color: "#6B6B6B" }), b.room + " · " + b.type)
          )
        ));
      });

      if (day.note) tl.push(e("div", { key: "note", className: "asc-mono", style: S.dayNote }, day.note));

      tl.push(e("div", { key: "slash", style: S.slashWrap },
        e("div", { style: S.slashLine }),
        e("span", { className: "asc-mono", style: S.slashLabel },
          e(IHome, { size: 11, color: "#B3272C" }),
          day.online ? "QUEST BOARD OPENS" : "HOME " + day.home),
        e("div", { style: S.slashLine })
      ));
    }

    if (isToday && todayLog.length) {
      tl.push(e("div", { key: "tlog", style: { marginTop: 4 } },
        todayLog.map(function (it, i) {
          return e("div", { key: i, style: S.timelineRow },
            e("div", { style: { width: 6, height: 6, borderRadius: "50%", background: it.color, marginTop: 5, flexShrink: 0 } }),
            e("span", { className: "asc-mono", style: S.timelineTime },
              new Date(it.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })),
            e("span", { className: "asc-mono", style: S.timelineLabel }, it.text)
          );
        })
      ));
    }
    kids.push(e("div", { key: "timeline", style: S.section }, tl));

    /* quest board */
    var qb = [];
    qb.push(e("div", { key: "qh", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },
      e("div", { className: "asc-display", style: S.sectionTitle }, "Quest Board"),
      e("span", { className: "asc-mono", style: { fontSize: 10, color: capReached ? "#C4453D" : "#7A7A7A" } },
        isThuToday ? "unlimited · thursday" : questsUsedToday + "/" + DAILY_QUEST_CAP + " today")
    ));
    if (capReached) {
      qb.push(e("div", { key: "cap", className: "asc-mono", style: Object.assign({}, S.freeNote, { marginBottom: 10 }) },
        "Daily quests used up. Home tasks, homework and events are still open — rest, or come back tomorrow."));
    }
    qb.push(e("div", { key: "qg", style: S.questGrid },
      QUESTS.map(function (q) {
        var meta = STAT_META[q.stat], isOpen = openQuest === q.id;
        var inner = [
          e("button", {
            key: "btn", className: "asc-questbtn", disabled: capReached,
            onClick: function () {
              setOpenQuest(isOpen ? null : q.id);
              setDetailText(q.inputType === "select" ? SUBJECTS[0] : "");
              setMinutes(25);
            },
            style: Object.assign({}, S.questBtn, { borderColor: isOpen ? meta.color : "#2A2A2A" })
          },
            e(q.icon, { size: 16, color: meta.color }),
            e("span", { className: "asc-mono", style: S.questLabel }, q.label),
            isOpen ? e(IX, { size: 13, color: "#7A7A7A" }) : e(IChevron, { size: 13, color: "#4A4A4A" })
          )
        ];
        if (isOpen) {
          var form = [];
          if (q.inputType === "select") {
            form.push(e("select", {
              key: "sel", className: "asc-select asc-mono", value: detailText,
              onChange: function (ev) { setDetailText(ev.target.value); }
            }, SUBJECTS.map(function (s) { return e("option", { key: s, value: s }, s); })));
          }
          if (q.hasDetail) {
            form.push(e("input", {
              key: "inp", className: "asc-mono", placeholder: q.prompt, value: detailText,
              onChange: function (ev) { setDetailText(ev.target.value); }, style: S.input
            }));
          }
          form.push(e("div", { key: "dl", className: "asc-mono", style: { fontSize: 10, color: "#7A7A7A", marginTop: 8 } }, "DURATION (minutes)"));
          form.push(e("div", { key: "chips", style: S.chipRow },
            DURATIONS.map(function (d) {
              return e("button", {
                key: d, className: "asc-mono", onClick: function () { setMinutes(d); },
                style: Object.assign({}, S.chip, {
                  borderColor: Number(minutes) === d ? meta.color : "#2A2A2A",
                  color: Number(minutes) === d ? "#EDEBE6" : "#8A8A8A"
                })
              }, d);
            }).concat([
              e("input", {
                key: "num", type: "number", className: "asc-mono", value: minutes, min: 1, max: 600,
                onChange: function (ev) { setMinutes(ev.target.value); }, style: S.numInput
              })
            ])
          ));
          form.push(e("button", {
            key: "go", className: "asc-mono",
            onClick: function () { submitQuest(q); },
            style: Object.assign({}, S.logBtn, { background: meta.color })
          }, "LOG QUEST · +" + minutes + " XP"));

          inner.push(e("div", { key: "form", style: Object.assign({}, S.questForm, { borderColor: meta.color }) }, form));
        }
        return e("div", { key: q.id, style: { gridColumn: isOpen ? "1 / -1" : "auto" } }, inner);
      })
    ));
    kids.push(e("div", { key: "quests", style: S.section }, qb));

    /* home tasks */
    kids.push(e("div", { key: "home", style: S.section },
      e("div", { className: "asc-display", style: Object.assign({}, S.sectionTitle, { marginBottom: 10 }) }, "Home Tasks"),
      e("div", { style: S.homeTaskRow },
        HOME_TASKS.map(function (t) {
          var done = !!(homeTasks[today] || {})[t.id];
          return e("button", {
            key: t.id, className: "asc-mono", onClick: function () { toggleHomeTask(t.id); },
            style: Object.assign({}, S.taskChip, { borderColor: done ? "#5FBF7A" : "#2A2A2A", color: done ? "#5FBF7A" : "#8A8A8A" })
          }, done ? e(ICheck, { size: 11, color: "#5FBF7A" }) : null, t.label);
        })
      )
    ));

    /* weekly tasks (sunday tab) */
    if (activeDay === "sun") {
      kids.push(e("div", { key: "weekly", style: S.section },
        e("div", { className: "asc-display", style: Object.assign({}, S.sectionTitle, { marginBottom: 10 }) }, "Weekly Tasks"),
        !isSundayNow ? e("div", { className: "asc-mono", style: { fontSize: 10, color: "#6B6B6B", marginBottom: 8 } }, "Preview — unlocks on Sunday") : null,
        e("div", { style: S.homeTaskRow },
          WEEKLY_TASKS.map(function (t) {
            var done = !!(weeklyTasks[today] || {})[t.id];
            return e("button", {
              key: t.id, className: "asc-mono", disabled: !isSundayNow,
              onClick: function () { toggleWeeklyTask(t.id); },
              style: Object.assign({}, S.taskChip, {
                borderColor: done ? "#5FBF7A" : "#2A2A2A",
                color: done ? "#5FBF7A" : "#8A8A8A",
                opacity: isSundayNow ? 1 : 0.5
              })
            }, done ? e(ICheck, { size: 11, color: "#5FBF7A" }) : null, t.label);
          })
        )
      ));
    }

    /* subjects */
    kids.push(e("div", { key: "subj", style: S.section },
      e("div", { className: "asc-display", style: Object.assign({}, S.sectionTitle, { marginBottom: 10 }) },
        e(ITarget, { size: 14, color: "#EDEBE6" }), "Subjects"),
      e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
        sortedSubjects.map(function (name) {
          var conf = (subjects[name] && subjects[name].confidence) || 0;
          var color = conf < 40 ? "#C4453D" : conf < 70 ? "#E8B84B" : "#5FBF7A";
          var mins = subjectMinutes(name), pend = hwPending(name);
          return e("div", { key: name, style: S.subjectRow },
            e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 } },
              e("span", { className: "asc-mono", style: { fontSize: 11.5, flex: 1 } }, name),
              e("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
                e("button", { className: "asc-mono", style: S.smallStep, onClick: function () { adjustConfidence(name, -10); } }, "−"),
                e("span", { className: "asc-mono", style: { fontSize: 10, color: color, width: 28, textAlign: "center" } }, conf + "%"),
                e("button", { className: "asc-mono", style: S.smallStep, onClick: function () { adjustConfidence(name, 10); } }, "+")
              )
            ),
            e("div", { style: S.barTrack },
              e("div", { className: "asc-bar-fill", style: Object.assign({}, S.barFill, { width: conf + "%", background: color }) })),
            e("div", { className: "asc-mono", style: { fontSize: 9, color: "#6B6B6B", marginTop: 3 } },
              mins + "m studied" + (pend > 0 ? " · " + pend + " homework pending" : ""))
          );
        })
      )
    ));

    /* events */
    var evKids = [
      e("div", { key: "h", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },
        e("div", { className: "asc-display", style: S.sectionTitle }, e(ICalendar, { size: 14, color: "#EDEBE6" }), "Events"),
        e("button", { style: S.addBtn, onClick: function () { setAddingEvent(!addingEvent); } },
          addingEvent ? e(IX, { size: 13, color: "#EDEBE6" }) : e(IPlus, { size: 13, color: "#EDEBE6" }))
      )
    ];
    if (addingEvent) {
      evKids.push(e("div", { key: "f", style: Object.assign({}, S.questForm, { borderColor: "#B3272C", marginBottom: 8, marginTop: 0 }) },
        e("input", { className: "asc-mono", placeholder: "Event title", value: evTitle, style: S.input, onChange: function (ev) { setEvTitle(ev.target.value); } }),
        e("input", { type: "date", className: "asc-datein asc-mono", value: evDate, style: { marginTop: 6 }, onChange: function (ev) { setEvDate(ev.target.value); } }),
        e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { background: "#B3272C" }), onClick: addEvent }, "ADD EVENT")
      ));
    }
    if (!sortedEvents.length && !addingEvent) {
      evKids.push(e("div", { key: "empty", className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "Nothing on the horizon."));
    }
    sortedEvents.forEach(function (ev) {
      var du = daysUntil(ev.date);
      evKids.push(e("div", { key: ev.id, style: S.listRow },
        e("span", { className: "asc-mono", style: { fontSize: 11, flex: 1 } }, ev.title),
        e("span", { className: "asc-mono", style: { fontSize: 10, color: du < 0 ? "#C4453D" : du <= 2 ? "#E8B84B" : "#7A7A7A" } },
          du < 0 ? "past" : du === 0 ? "today" : "in " + du + "d"),
        e("button", { style: S.iconBtn, onClick: function () { setEvents(events.filter(function (x) { return x.id !== ev.id; })); } },
          e(ITrash, { size: 12, color: "#5A5A5A" }))
      ));
    });
    kids.push(e("div", { key: "events", style: S.section }, evKids));

    /* homework */
    var hwKids = [
      e("div", { key: "h", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },
        e("div", { className: "asc-display", style: S.sectionTitle }, e(IClipboard, { size: 14, color: "#EDEBE6" }), "Homework"),
        e("button", { style: S.addBtn, onClick: function () { setAddingHw(!addingHw); } },
          addingHw ? e(IX, { size: 13, color: "#EDEBE6" }) : e(IPlus, { size: 13, color: "#EDEBE6" }))
      )
    ];
    if (addingHw) {
      hwKids.push(e("div", { key: "f", style: Object.assign({}, S.questForm, { borderColor: "#6FA8DC", marginBottom: 8, marginTop: 0 }) },
        e("input", { className: "asc-mono", placeholder: "Assignment title", value: hwTitle, style: S.input, onChange: function (ev) { setHwTitle(ev.target.value); } }),
        e("select", { className: "asc-select asc-mono", value: hwSubject, style: { marginTop: 6 }, onChange: function (ev) { setHwSubject(ev.target.value); } },
          SUBJECTS.map(function (s) { return e("option", { key: s, value: s }, s); })),
        e("input", { type: "date", className: "asc-datein asc-mono", value: hwDue, style: { marginTop: 6 }, onChange: function (ev) { setHwDue(ev.target.value); } }),
        e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { background: "#6FA8DC" }), onClick: addHomework }, "ADD HOMEWORK")
      ));
    }
    if (!sortedHw.length && !addingHw) {
      hwKids.push(e("div", { key: "empty", className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "Nothing pending."));
    }
    sortedHw.forEach(function (h) {
      var du = daysUntil(h.due);
      hwKids.push(e("div", { key: h.id, style: S.listRow },
        e("button", { style: S.iconBtn, onClick: function () { toggleHomework(h.id); } },
          e(ICheck, { size: 13, color: h.done ? "#5FBF7A" : "#3A3A3A" })),
        e("div", { style: { flex: 1, display: "flex", flexDirection: "column", opacity: h.done ? 0.4 : 1 } },
          e("span", { className: "asc-mono", style: { fontSize: 11, textDecoration: h.done ? "line-through" : "none" } }, h.title),
          e("span", { className: "asc-mono", style: { fontSize: 9, color: "#6B6B6B" } }, h.subject)),
        !h.done ? e("span", { className: "asc-mono", style: { fontSize: 10, color: du < 0 ? "#C4453D" : du <= 2 ? "#E8B84B" : "#7A7A7A" } },
          du < 0 ? "overdue" : du === 0 ? "today" : du + "d") : null,
        e("button", { style: S.iconBtn, onClick: function () { setHomework(homework.filter(function (x) { return x.id !== h.id; })); } },
          e(ITrash, { size: 12, color: "#5A5A5A" }))
      ));
    });
    kids.push(e("div", { key: "homework", style: S.section }, hwKids));

    /* full log */
    var lg = [e("button", { key: "tog", className: "asc-mono", style: S.logToggle, onClick: function () { setShowLog(!showLog); } },
      (showLog ? "Hide" : "Show") + " full quest log (" + log.length + ")")];
    if (showLog) {
      lg.push(e("div", { key: "list", style: S.logList },
        log.length === 0
          ? e("div", { className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "No quests logged yet.")
          : log.map(function (l) {
              return e("div", { key: l.id, style: S.logRow },
                e("div", { style: { width: 6, height: 6, borderRadius: "50%", background: STAT_META[l.stat].color, flexShrink: 0 } }),
                e("span", { className: "asc-mono", style: { fontSize: 11, color: "#C9C9C9", flex: 1 } }, l.detail),
                e("span", { className: "asc-mono", style: { fontSize: 10, color: "#6B6B6B" } }, l.minutes + "m")
              );
            })
      ));
    }
    kids.push(e("div", { key: "log", style: S.section }, lg));

    return e("div", { style: S.page }, kids);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Ascent));
})();
</script>
</body>
</html>
