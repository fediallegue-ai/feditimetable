    /* interests */

    });
    listsKids.push(e("div", { key: "interests", style: S.section }, intKids));

    /* events */
    var evKids = [
      e("div", { key: "h", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },

        e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { background: "#B3272C" }), onClick: addEvent }, "ADD EVENT")

    }
    if (!sortedEvents.length && !addingEvent) {
      evKids.push(e("div", { key: "empty", className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "Nothing on the horizon."));

    sortedEvents.forEach(function (ev) {

    listsKids.push(e("div", { key: "events", style: S.section }, evKids));

    /* homework */
    var hwKids = [
      e("div", { key: "h", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },

        e("button", { style: S.addBtn, onClick: function () { setAddingHw(!addingHw); } },
          addingHw ? e(IX, { size: 13, color: "#EDEBE6" }) : e(IPlus, { size: 13, color: "#EDEBE6" }))

    if (addingHw) {
      hwKids.push(e("div", { key: "f", style: Object.assign({}, S.questForm, { borderColor: "#6FA8DC", marginBottom: 8, marginTop: 0 }) },

      hwKids.push(e("div", { key: "empty", className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "Nothing pending."));

    sortedHw.forEach(function (h) {

      hwKids.push(e("div", { key: h.id, style: S.listRow },
        e("button", { style: S.iconBtn, onClick: function () { toggleHomework(h.id); } },

        e("div", { style: { flex: 1, display: "flex", flexDirection: "column", opacity: h.done ? 0.4 : 1 } },

          e("span", { className: "asc-mono", style: { fontSize: 9, color: "#6B6B6B" } }, h.subject)),
        !h.done ? e("span", { className: "asc-mono", style: { fontSize: 10, color: du < 0 ? "#C4453D" : du <= 2 ? "#E8B84B" : "#7A7A7A" } },
          du < 0 ? "overdue" : du === 0 ? "today" : du + "d") : null,
        e("button", { style: S.iconBtn, onClick: function () { setHomework(homework.filter(function (x) { return x.id !== h.id; })); } },
          e(ITrash, { size: 12, color: "#5A5A5A" }))
      ));
    });
    listsKids.push(e("div", { key: "homework", style: S.section }, hwKids));

    /* clubs */
    var curClub = clubs.filter(function (c) { return c.id === activeClub; })[0] || clubs[0];
    var clKids = [
      e("div", { key: "h", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },
        e("div", { className: "asc-display", style: S.sectionTitle }, e(IUsers, { size: 14, color: "#EDEBE6" }), "Clubs"),
        e("button", { style: S.addBtn, onClick: function () { setAddingClub(!addingClub); } },
          addingClub ? e(IX, { size: 13, color: "#EDEBE6" }) : e(IPlus, { size: 13, color: "#EDEBE6" }))
      )
    ];
    if (addingClub) {
      clKids.push(e("div", { key: "newclub", style: Object.assign({}, S.questForm, { borderColor: "#E88A6F", marginBottom: 8, marginTop: 0 }) },
        e("input", { className: "asc-mono", placeholder: "Club name", value: newClubName, style: S.input, onChange: function (ev) { setNewClubName(ev.target.value); } }),
        e("button", {
          className: "asc-mono", onClick: function () { setNewClubBureau(!newClubBureau); },
          style: Object.assign({}, S.chip, { marginTop: 8, borderColor: newClubBureau ? "#E88A6F" : "#2A2A2A", color: newClubBureau ? "#E88A6F" : "#8A8A8A" })
        }, (newClubBureau ? "✓ " : "") + "I'm in the bureau (enables ideas board)"),
        e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { background: "#E88A6F" }), onClick: addClub }, "ADD CLUB")
      ));
    }
    clKids.push(e("div", { key: "chips", className: "asc-scroll", style: { display: "flex", gap: 6, overflowX: "auto", marginBottom: 10 } },
      clubs.map(function (c) {
        var on = curClub && c.id === curClub.id;
        return e("button", {
          key: c.id, className: "asc-mono",
          onClick: function () { setActiveClub(c.id); setAddingClubItem(false); },
          style: Object.assign({}, S.chip, { whiteSpace: "nowrap", borderColor: on ? "#E88A6F" : "#2A2A2A", color: on ? "#EDEBE6" : "#8A8A8A", background: on ? "#171010" : "transparent" })
        }, c.name);
      })
    ));

    if (curClub) {
      var clubDated = clubItems.filter(function (ci) { return ci.clubId === curClub.id && ci.kind !== "idea"; })
        .sort(function (a, b) { return a.done === b.done ? a.date.localeCompare(b.date) : (a.done ? 1 : -1); });
      var clubIdeas = clubItems.filter(function (ci) { return ci.clubId === curClub.id && ci.kind === "idea"; });

      clKids.push(e("div", { key: "dh", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 } },
        e("span", { className: "asc-mono", style: { fontSize: 10, color: "#7A7A7A" } }, "EVENTS & DEADLINES"),
        e("div", { style: { display: "flex", gap: 6 } },
          e("button", { style: S.addBtn, onClick: function () { setAddingClubItem(addingClubItem === "dated" ? false : "dated"); setCiTitle(""); setCiDate(""); } },
            addingClubItem === "dated" ? e(IX, { size: 12, color: "#EDEBE6" }) : e(IPlus, { size: 12, color: "#EDEBE6" })),
          e("button", { style: S.iconBtn, title: "Remove club", onClick: function () { removeClub(curClub.id); } }, e(ITrash, { size: 12, color: "#5A5A5A" }))
        )
      ));
      if (addingClubItem === "dated") {
        clKids.push(e("div", { key: "dform", style: Object.assign({}, S.questForm, { borderColor: "#E88A6F", marginBottom: 8, marginTop: 0 }) },
          e("input", { className: "asc-mono", placeholder: "Title", value: ciTitle, style: S.input, onChange: function (ev) { setCiTitle(ev.target.value); } }),
          e("input", { type: "date", className: "asc-datein asc-mono", value: ciDate, style: { marginTop: 6 }, onChange: function (ev) { setCiDate(ev.target.value); } }),
          e("div", { style: { display: "flex", gap: 6, marginTop: 8 } },
            ["event", "deadline"].map(function (k) {
              return e("button", {
                key: k, className: "asc-mono", onClick: function () { setCiKind(k); },
                style: Object.assign({}, S.chip, { flex: 1, borderColor: ciKind === k ? "#E88A6F" : "#2A2A2A", color: ciKind === k ? "#E88A6F" : "#8A8A8A" })
              }, k);
            })
          ),
          e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { background: "#E88A6F" }), onClick: function () { addClubItem(false); } }, "ADD")
        ));
      }
      if (!clubDated.length && addingClubItem !== "dated") {
        clKids.push(e("div", { key: "dempty", className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A", marginBottom: 6 } }, "Nothing tracked for " + curClub.name + " yet."));
      }
      clubDated.forEach(function (ci) {
        var du = daysUntil(ci.date);
        clKids.push(e("div", { key: ci.id, style: S.listRow },
          e("button", { style: S.iconBtn, onClick: function () { toggleClubItem(ci.id); } },
            e(ICheck, { size: 13, color: ci.done ? "#5FBF7A" : "#3A3A3A" })),
          e("div", { style: { flex: 1, display: "flex", flexDirection: "column", opacity: ci.done ? 0.4 : 1 } },
            e("span", { className: "asc-mono", style: { fontSize: 11, textDecoration: ci.done ? "line-through" : "none" } }, ci.title),
            e("span", { className: "asc-mono", style: { fontSize: 9, color: ci.kind === "deadline" ? "#C4453D" : "#6FA8DC" } }, ci.kind + " · " + ci.date)
          ),
          !ci.done ? e("span", { className: "asc-mono", style: { fontSize: 10, color: du < 0 ? "#C4453D" : du <= 2 ? "#E8B84B" : "#7A7A7A" } },
            du < 0 ? "overdue" : du === 0 ? "today" : du + "d") : null,
          e("button", { style: S.iconBtn, onClick: function () { removeClubItem(ci.id); } }, e(ITrash, { size: 12, color: "#5A5A5A" }))
        ));
      });

      if (curClub.bureau) {
        clKids.push(e("div", { key: "ih", style: { display: "flex", justifyContent: "space-between", alignItems: "center", margin: "14px 0 6px" } },
          e("span", { className: "asc-mono", style: { fontSize: 10, color: "#7A7A7A" } }, "IDEAS BOARD"),
          e("button", { style: S.addBtn, onClick: function () { setAddingClubItem(addingClubItem === "idea" ? false : "idea"); setCiTitle(""); setCiNote(""); } },
            addingClubItem === "idea" ? e(IX, { size: 12, color: "#EDEBE6" }) : e(IPlus, { size: 12, color: "#EDEBE6" }))
        ));
        if (addingClubItem === "idea") {
          clKids.push(e("div", { key: "iform", style: Object.assign({}, S.questForm, { borderColor: "#E88A6F", marginBottom: 8, marginTop: 0 }) },
            e("input", { className: "asc-mono", placeholder: "Idea", value: ciTitle, style: S.input, onChange: function (ev) { setCiTitle(ev.target.value); } }),
            e("input", { className: "asc-mono", placeholder: "Short note (optional)", value: ciNote, style: Object.assign({}, S.input, { marginTop: 6 }), onChange: function (ev) { setCiNote(ev.target.value); } }),
            e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { background: "#E88A6F" }), onClick: function () { addClubItem(true); } }, "ADD IDEA")
          ));
        }
        if (!clubIdeas.length && addingClubItem !== "idea") {
          clKids.push(e("div", { key: "iempty", className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "No ideas yet."));
        }
        clubIdeas.forEach(function (ci) {
          var st = ci.status || "new";
          var stColor = st === "done" ? "#5FBF7A" : st === "planned" ? "#E8B84B" : "#7A7A7A";
          clKids.push(e("div", { key: ci.id, style: S.listRow },
            e("div", { style: { flex: 1, display: "flex", flexDirection: "column", opacity: st === "done" ? 0.5 : 1 } },
              e("span", { className: "asc-mono", style: { fontSize: 11, textDecoration: st === "done" ? "line-through" : "none" } }, ci.title),
              ci.note ? e("span", { className: "asc-mono", style: { fontSize: 9, color: "#6B6B6B" } }, ci.note) : null
            ),
            e("button", {
              className: "asc-mono", onClick: function () { cycleIdeaStatus(ci.id); },
              style: Object.assign({}, S.chip, { fontSize: 9, borderColor: stColor, color: stColor })

            e("button", { style: S.iconBtn, onClick: function () { removeClubItem(ci.id); } }, e(ITrash, { size: 12, color: "#5A5A5A" }))
          ));
        });
      }
    }
    listsKids.push(e("div", { key: "clubs", style: S.section }, clKids));

    /* backup */
    settingsKids.push(e("div", { key: "backup", style: S.section },
      e("div", { className: "asc-display", style: Object.assign({}, S.sectionTitle, { marginBottom: 10 }) }, "Backup"),
      e("div", { className: "asc-mono", style: { fontSize: 10, color: "#6B6B6B", marginBottom: 8 } },
        "Progress lives in this browser only. Export a copy before clearing your cache or switching devices."),
      e("div", { style: { display: "flex", gap: 8 } },
        e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { marginTop: 0, flex: 1, background: "transparent", border: "1px solid #2A2A2A", color: "#EDEBE6" }), onClick: exportSave }, "EXPORT"),
        e("button", { className: "asc-mono", style: Object.assign({}, S.logBtn, { marginTop: 0, flex: 1, background: "transparent", border: "1px solid #2A2A2A", color: "#EDEBE6" }), onClick: triggerImport }, "IMPORT")
      ),
      e("input", { type: "file", accept: "application/json", ref: importRef, onChange: handleImportFile, style: { display: "none" } })
    ));

    /* history: quest log + exam history */
    var pastExams = exams.filter(function (ex) { return daysUntil(ex.date) < 0; }).sort(function (a, b) { return b.date.localeCompare(a.date); });
    settingsKids.push(e("div", { key: "history", style: S.section },
      e("div", { className: "asc-display", style: Object.assign({}, S.sectionTitle, { marginBottom: 10 }) }, "History"),
      e("div", { className: "asc-mono", style: { fontSize: 10, color: "#7A7A7A", marginBottom: 6 } }, "QUEST LOG (" + log.length + ")"),
      e("div", { style: S.logList },
        log.length === 0
          ? e("div", { className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "No quests logged yet.")
          : log.map(function (l) {
              return e("div", { key: l.id, style: S.logRow },
                e("div", { style: { width: 6, height: 6, borderRadius: "50%", background: STAT_META[l.stat].color, flexShrink: 0 } }),

                e("span", { className: "asc-mono", style: { fontSize: 10, color: "#6B6B6B" } }, l.minutes + "m")
              );
            })
      ),
      e("div", { className: "asc-mono", style: { fontSize: 10, color: "#7A7A7A", margin: "14px 0 6px" } }, "EXAM HISTORY (" + pastExams.length + ")"),
      e("div", { style: S.logList },
        pastExams.length === 0
          ? e("div", { className: "asc-mono", style: { fontSize: 11, color: "#5A5A5A" } }, "No past exams yet.")
          : pastExams.map(function (ex) {
              var titles = examChapterTitles(ex);
              return e("div", { key: ex.id, style: S.logRow },
                e("div", { style: { width: 6, height: 6, borderRadius: "50%", background: "#E8B84B", flexShrink: 0 } }),
                e("div", { style: { flex: 1, display: "flex", flexDirection: "column" } },
                  e("span", { className: "asc-mono", style: { fontSize: 11, color: "#C9C9C9" } }, ex.subject + " — " + ex.date),
                  titles.length ? e("span", { className: "asc-mono", style: { fontSize: 9, color: "#6B6B6B" } }, titles.join(", ")) : null
                ),
                e("button", { style: S.iconBtn, onClick: function () { removeExam(ex.id); } }, e(ITrash, { size: 11, color: "#5A5A5A" }))
              );
            })
      )
    ));

    var tabContent = navTab === "today" ? todayKids : navTab === "growth" ? growthKids : navTab === "lists" ? listsKids : settingsKids;
    kids.push(e("div", { key: "tabcontent" }, tabContent));

    return e("div", { style: S.page }, kids);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(Ascent));
})();
</script>
